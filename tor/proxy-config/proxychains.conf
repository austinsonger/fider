# Proxychains configuration for Fider Tor deployment
# This ensures all outbound connections go through Tor

# Use strict chain mode - all proxies must be online
strict_chain

# Proxy DNS requests through Tor
proxy_dns

# Connection timeouts
tcp_read_time_out 15000
tcp_connect_time_out 8000

# Quiet mode - reduce logging
quiet_mode

# Chain length (number of proxies in chain)
chain_len = 1

# Proxy list
[ProxyList]
# Tor SOCKS5 proxy
socks5 tor 9050
